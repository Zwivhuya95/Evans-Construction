    <main class="container">
        <section class="contact-section">
            <h2>Contact Us</h2>
            <!-- Direct Contact info display area -->
             <div class="contact-info-display">
                <p><strong>Phone:</strong><a href="tel:0636030702">063 603 0702</a></p>
                <p><strong>Email:<a href="email:apsthendoemulaudzy@icloud.com">apsthendoemulaudzy@icloud.com</a></strong></p>
             </div>
            <!-- CONTACT FORM -->
        <form class="contact-form">
            <label>Full Name</label>
            <input type="text" id="name" required>
            <label>Email</label>
            <input type="email" id="email" required>
            <label>Phone Number</label>
            <input type="tel" id="phone" required>
            <label>Service</label>
            <select required>
                <option>Paving</option>
                <option>Painting</option>
                <option>Renovation</option>
                <option>Aluminium</option>
                <option>Landscaping</option>
            </select>
            <label>Message</label>
            <textarea id="message" required></textarea>
            <button type="submit">Submit</button>
            <div id="result"></div>
        </form>
        </section>
